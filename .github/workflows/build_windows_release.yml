name: Build Windows Release (x64 & ARM64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v2.1.11-bashu'
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_windows:
    name: Build Windows ${{ matrix.arch }} Native Installer & Portable
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      TAG_NAME: ${{ github.event.inputs.release_tag || 'v2.1.11-bashu' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET SDKs (8.0 and 9.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Go (1.26)
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.0'
          check-latest: false
          cache-dependency-path: tools/bashu-rtc/go.sum

      - name: Run platform synchronization regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/BashuPlatformSmoke/BashuPlatformSmoke.csproj
          dotnet run --project tests/NotificationPrioritySmoke/NotificationPrioritySmoke.csproj
          dotnet run --project tests/BashuRtcSmoke/BashuRtcSmoke.csproj

      - name: Generate Dummy Secrets File
        shell: pwsh
        run: |
          ./tools/release-gen/generate-secrets.ps1

      - name: Publish ClassIsland.Desktop for Windows ${{ matrix.arch }}
        shell: pwsh
        run: |
          dotnet publish ClassIsland.Desktop/ClassIsland.Desktop.csproj -c Release -r win-${{ matrix.arch }} --self-contained true -p:PublishBuilding=true -p:PublishPlatform=windows -p:Platforms_Windows=true -p:ClassIsland_PlatformTarget=${{ matrix.arch }} -p:SelfContained=true -p:ClassIsland_SelfContained=true -p:Version=2.1.11 -p:AssemblyVersion=2.1.11.0 -p:FileVersion=2.1.11.0 -p:ApplicationVersion=2.1.11 -p:ApplicationDisplayVersion=2.1.11 -o ${{ github.workspace }}/out_publish

      - name: Build BashuRtc Native Helper for Windows ${{ matrix.arch }}
        shell: pwsh
        run: |
          $goarch = if ("${{ matrix.arch }}" -eq "x64") { "amd64" } else { "arm64" }
          Write-Output "Building BashuRtc.exe for Windows $goarch..."
          Push-Location tools/bashu-rtc
          $env:GOOS = "windows"
          $env:GOARCH = $goarch
          $env:CGO_ENABLED = "0"
          go mod tidy
          go build -ldflags "-s -w" -o "${{ github.workspace }}/out_publish/BashuRtc.exe" .
          Pop-Location
          if (-not (Test-Path "${{ github.workspace }}/out_publish/BashuRtc.exe")) {
            throw "BashuRtc.exe was not created in out_publish!"
          }

      - name: Verify and Prepare Executables
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ github.workspace }}/out_publish"
          if (Test-Path "${{ github.workspace }}/out_publish/ClassIsland.Desktop.exe") {
            Copy-Item "${{ github.workspace }}/out_publish/ClassIsland.Desktop.exe" "${{ github.workspace }}/out_publish/ClassIsland.exe" -Force
          }
          if (-not (Test-Path "${{ github.workspace }}/out_publish/ClassIsland.exe")) {
            throw "ClassIsland.exe was not found in out_publish!"
          }
          $expected = if ("${{ matrix.arch }}" -eq "x64") { 0x8664 } else { 0xAA64 }
          foreach ($name in @("ClassIsland.exe", "coreclr.dll", "BashuRtc.exe")) {
            $bytes = [IO.File]::ReadAllBytes("${{ github.workspace }}/out_publish/$name")
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
            if ($machine -ne $expected) { throw "Wrong architecture in $name : $machine (expected $expected)" }
            Write-Output "PASS native architecture $name : $machine"
          }
          $version = [Reflection.AssemblyName]::GetAssemblyName("${{ github.workspace }}/out_publish/ClassIsland.dll").Version.ToString()
          if ($version -ne "2.1.11.0") { throw "Unexpected application version: $version" }
          $fileVersion = (Get-Item "${{ github.workspace }}/out_publish/ClassIsland.dll").VersionInfo.FileVersion
          if ($fileVersion -notlike "2.1.11.0*") { throw "Unexpected file version: $fileVersion" }

      - name: Prepare Installer Output Directory
        shell: pwsh
        run: |
          Set-Content -Value "installer" -Path "${{ github.workspace }}/out_publish/PackageType" -Force -NoNewline
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/out_installer"

      - name: Build Inno Setup Installer (.exe)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./installer/setup.iss
          options: |
            /DAppVersion=2.1.11
            /FClassIsland-Teaching-Windows-${{ matrix.arch }}-Setup
            /O${{ github.workspace }}\out_installer
            /DSourceDir=${{ github.workspace }}\out_publish
            /DArch=${{ matrix.arch }}

      - name: Prepare Portable Zip
        shell: pwsh
        run: |
          Set-Content -Value "folder" -Path "${{ github.workspace }}/out_publish/PackageType" -Force -NoNewline
          Compress-Archive -Path "${{ github.workspace }}/out_publish/*" -DestinationPath "${{ github.workspace }}/out_installer/ClassIsland-Teaching-Windows-${{ matrix.arch }}-Portable.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland-Windows-${{ matrix.arch }}-Binaries
          path: |
            ${{ github.workspace }}/out_installer/*.exe
            ${{ github.workspace }}/out_installer/*.zip
          if-no-files-found: error

  release:
    name: Publish Release to GitHub
    # Branch pushes validate both architectures and retain workflow artifacts.
    # Publishing a named release is explicit so an immutable tag is never overwritten.
    if: github.event_name == 'workflow_dispatch'
    needs: [build_windows]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.release_tag || 'v2.1.11-bashu' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/all_artifacts

      - name: List Downloaded Files
        run: |
          find ${{ github.workspace }}/all_artifacts -type f

      - name: Verify complete release and create checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release_files
          for arch in x64 arm64; do
            for suffix in Setup.exe Portable.zip; do
              name="ClassIsland-Teaching-Windows-${arch}-${suffix}"
              mapfile -t matches < <(find all_artifacts -type f -name "$name")
              test "${#matches[@]}" -eq 1
              cp "${matches[0]}" "release_files/$name"
            done
          done
          cd release_files
          sha256sum *.exe *.zip > SHA256SUMS.txt

      - name: Release Windows Binaries to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: "ClassIsland 智慧教研版 ${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          body: |
            ## ClassIsland 智慧教研版（Windows x64 与 ARM64 双架构发布）

            本版本基于 ClassIsland 官方 Avalonia 原生客户端深度定制，专为两江巴蜀智慧校园环境打造。

            ### 核心更新与修复 (v2.1.11)
            - **特供版更新通道锁定：** 内置检查更新只查询 `Stuart-0728/ClassIsland` 的智慧教研特供版，不再连接普通 ClassIsland 差分更新通道，也不会被普通版自动覆盖。
            - **实时音频解码修复：** 根据现场日志修复偶发空帧或损坏 Opus 帧导致整个 WebRTC 会话退出的问题；异常帧会被安全丢弃，后续语音继续实时播放。
            - **并发对讲仲裁：** 同一班级同时出现多个发言时只保留一个实时音频与灵动岛；紧急广播优先，普通广播不会抢占紧急广播。
            - **可诊断日志：** 对讲失败会记录会话编号、真实异常消息和 Opus 错误码，便于现场精确排障。
            - **实时对讲保活修复：** 修正原生 WebRTC 接收器默认 5 秒无网络活动即判为断开的问题，加入 2 秒 ICE 保活和校园网短暂抖动容忍。
            - **移动端连接优化：** TURN 改为后备通道，同时保留局域网直连候选，避免手机被强制绑定到单一中继路径。
            - **瞬时断网自愈：** 课表/通知轮询短暂失败不再关闭已连接的对讲，信令更新增加快速重试。
            - **15 秒断流专项修复：** 平台不再反复重建浏览器录音器，TURN 支持 UDP 优先与 TCP 后备，避免候选路径切换导致实时音频中断。
            - **对讲连接和延迟二次优化：** SDP 立即发送、ICE 候选增量传输，大屏以长轮询被新会话即时唤醒；起播缓冲降至 40ms，积压上限降至 120ms。
            - **播报音量自动保障：** 平台通知、Edge TTS 语音和实时对讲开始时可自动解除静音并将 Windows 主音量提升到最大，全部结束后恢复播报前音量与静音状态。
            - **年级独立作息同步：** 配套平台可为初一、初二、初三分别配置节次时间与星期特例，大屏按绑定班级年级自动同步。
            - **对讲抗抖动与防断续算法重构：** 彻底重构 Jitter Buffer 动态平滑算法，解决网络偶发微小抖动时的缓冲饥饿震荡问题，消除机关枪式卡顿、断字与爆音。
            - **毫秒级闪电握手：** 将 ICE 候选者收集超时从 8 秒缩短至 1 秒，老师按住说话 2~5 秒的简短通告也能在第 1~2 秒闪电进入超低延迟实时流。
            - **网络抖动自愈容忍：** 优化连接状态监控，对公网瞬态 `disconnected` 赋予自愈宽限期，避免误判直接掐线。
            - **支持 TCP 与 UDP 双 TURN 中继：** 自动探测并支持在校园网 UDP 受阻时，平滑回退走 TCP 3478 进行实时音频流穿透。
            - **全屏强提醒模式（含语音朗读与触控确认）：** 针对重要集队、紧急广播与重要通告，班级大屏黑晶磨砂覆层全屏展示，伴随高保真语音播报，必须现场轻触“确认收到”方可关闭，防止信息遗漏。
            - **确认回执与状态同步：** 现场点击确认后，自动清空多余语音朗读队列并实时上报回执，网页端与后台实时展示“已确认收到”时间。
            - **WebRTC 原生实时对讲引擎集成：** 内置原生编译的 `BashuRtc.exe`（Windows x64 与 ARM64 原生二进制），打通与服务器 UDP 3478 / TURN 的实时语音流，支持毫秒级低延迟对讲。
            - **双通道无缝容灾保护：** 实时 WebRTC 通道与 PCM WAV 兼容通道双轨并行；服务器配置 TURN 时固定使用稳定中继，实时链路异常时再切换至 WAV 兼容通道。
            - **Windows 双架构原生支持：** 全面支持 Windows 64位（Intel/AMD）与 Windows ARM64（高通骁龙 X Elite / Surface Pro X 等设备）。
            - **整周 7 天课表独立模型：** 支持周五提前放学等差异化作息，避免单日临时课表互相覆盖，北京时间午夜 0 点自动刷新今日课表；课间休息不偏移课程序号。
            - **通知发出人与滚动时长智能估算：** 标题和正文显示教师姓名，按内容长度、标点停顿与重复次数智能估算展示时长，避免重复触发朗读或过早消失。
            - **紧急通知优先级抢占与音频打断保护：** 当紧急广播到达时，即时静音并中断普通对讲音频，待紧急事项结束后安全恢复；回执不再阻塞下一段播放。
            - **新安装默认配置：** 微软雅黑 + ExtraBlack，Edge TTS 和提示音开启；重庆天气；天气、日期、时间、课表布局，时间不闪烁且不显示秒。升级保留已保存设置。
            - **极简配对体验：** 主岛与托盘菜单新增“绑定班级大屏”一键直达，预填平台地址，仅需输入 6 位配对码即可一键完成绑定。

            ### 下载文件说明
            - **Windows x64 一键安装版：** `ClassIsland-Teaching-Windows-x64-Setup.exe`
            - **Windows x64 绿色便携版：** `ClassIsland-Teaching-Windows-x64-Portable.zip`
            - **Windows ARM64 一键安装版：** `ClassIsland-Teaching-Windows-arm64-Setup.exe`
            - **Windows ARM64 绿色便携版：** `ClassIsland-Teaching-Windows-arm64-Portable.zip`

            ### 配套要求与验证边界
            - 平台必须同步部署 `scheduleWeek`、通知 `created_by_name` 和 WAV 音频上传支持；教师需刷新网页后发起对讲。
            - 微软雅黑使用 Windows 已安装字体；实际字重由系统字体支持决定，不附带商业字体文件。
            - 已执行模型回归、双架构构建和 PE 架构校验（0x8664 / 0xAA64）；实际教室设备发声、窗口显示和线上联动仍需验收。
            - 未进行代码签名，Windows 可能提示未知发布者；请核对 SHA256SUMS.txt。
          files: |
            ${{ github.workspace }}/release_files/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
