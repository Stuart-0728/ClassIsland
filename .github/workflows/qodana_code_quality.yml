name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - master
      - dev

jobs:
  qodana:
    runs-on: windows-latest
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1826663083 }}
      QODANA_ENDPOINT: 'https://qodana.cloud'
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
          submodules: recursive
      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Generate Dummy Secrets File
        shell: pwsh
        run: ./tools/release-gen/generate-secrets.ps1
      - name: Build Project
        run: dotnet build ClassIsland.Desktop/ClassIsland.Desktop.csproj -c Release -p:PublishPlatform=windows -p:Platforms_Windows=true -p:ClassIsland_PlatformTarget=x64
      - name: 'Qodana Scan'
        if: ${{ env.QODANA_TOKEN != '' }}
        uses: JetBrains/qodana-action@v2025.1
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }} 
